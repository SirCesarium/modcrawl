[package]
name = "modcrawl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
java-class-rs = { version = "0.1.0", default-features = false }

[dependencies.modcrawl]
path = ".."
features = ["classfile"]

[[bin]]
name = "fuzz_classfile"
path = "fuzz_targets/fuzz_classfile.rs"
test = false
doc = false

[[bin]]
name = "fuzz_metadata"
path = "fuzz_targets/fuzz_metadata.rs"
test = false
doc = false

[[bin]]
name = "fuzz_jar"
path = "fuzz_targets/fuzz_jar.rs"
test = false
doc = false
