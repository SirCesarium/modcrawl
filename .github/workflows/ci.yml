name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  # The C ABI is part of the public interface, so it is checked like one:
  # the header must match the exported symbols and must compile as C and as
  # C++ with warnings treated as errors.
  ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cbindgen
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      - name: Build library
        run: cargo build --release
      - name: Generate header
        run: cbindgen --config cbindgen.toml --crate modcrawl --output modcrawl.h
      - name: Check header against exported symbols
        run: .github/scripts/check-ffi-symbols.sh modcrawl.h target/release/libmodcrawl.so
      - name: Build smoke test as C and as C++
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I. tests/ffi/smoke.c -Ltarget/release -lmodcrawl -o /tmp/smoke-c
          g++ -std=c++17 -Wall -Wextra -Werror -I. tests/ffi/smoke.c -Ltarget/release -lmodcrawl -o /tmp/smoke-cpp
      - name: Run smoke test
        run: |
          python3 - <<'PY'
          import json, zipfile
          fabric = {
              "schemaVersion": 1, "id": "testmod", "name": "Test Mod",
              "version": "1.0.0", "environment": "*",
              "depends": {"fabricloader": ">=0.15.0"},
          }
          with zipfile.ZipFile("/tmp/smoke.jar", "w") as jar:
              jar.writestr("fabric.mod.json", json.dumps(fabric))
          PY
          LD_LIBRARY_PATH=target/release /tmp/smoke-c /tmp/smoke.jar
          LD_LIBRARY_PATH=target/release /tmp/smoke-cpp /tmp/smoke.jar
      # `classfile` is a default feature, so a `--no-default-features` build is
      # the one shape where the header — which describes the default build —
      # does *not* match the library. Nothing we ship is built that way, but the
      # crate is on crates.io, so the contract is pinned here rather than left
      # to be rediscovered as a link error.
      - name: Pin the no-default-features symbol contract
        run: |
          CARGO_TARGET_DIR=target/nodefault cargo build --release --no-default-features
          lib=target/nodefault/release/libmodcrawl.so
          syms=$(nm -g --defined-only "$lib" | awk '{print $NF}' | grep -E '^modcrawl_' | sort -u)
          status=0
          for s in modcrawl_identify modcrawl_identify_bytes \
                   modcrawl_metadata modcrawl_metadata_json \
                   modcrawl_metadata_bytes modcrawl_metadata_json_bytes \
                   modcrawl_deps modcrawl_deps_json \
                   modcrawl_deps_bytes modcrawl_deps_json_bytes \
                   modcrawl_free_string; do
            echo "$syms" | grep -qx "$s" || {
              echo "error: core symbol $s missing from a no-default-features build" >&2
              status=1
            }
          done
          for s in modcrawl_classes_json modcrawl_grep_json \
                   modcrawl_mixins_json modcrawl_dupes_json; do
            if echo "$syms" | grep -qx "$s"; then
              echo "error: $s is exported without the classfile feature;" >&2
              echo "       the shipped header declares it, so either keep it in" >&2
              echo "       [features] default or stop declaring it in cbindgen.toml" >&2
              status=1
            fi
          done
          echo "no-default-features contract holds: 11 core exports, classfile exports absent"
          exit $status
