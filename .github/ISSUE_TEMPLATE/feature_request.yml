name: Feature request
description: Suggest an idea or improvement for modcrawl
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the problem and the solution you have in mind.

        Before opening a new issue, please search the existing issues and discussions to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem are you trying to solve? Is your request related to a frustration or a missing capability?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you have considered.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Which parts of modcrawl does this feature apply to?
      options:
        - label: CLI
        - label: Rust library
        - label: npm package (WASM)
        - label: Web version
        - label: Documentation

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, examples, or mockups about the feature request.
