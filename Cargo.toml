[package]
name = "modcrawl"
version = "0.1.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
zipcrawl = { version = "2.1.0", default-features = false, features = ["serde"] }

[[bin]]
name = "modcrawl"
path = "src/main.rs"

[lib]
name = "modcrawl"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
absolute_paths = "deny"

[build-dependencies]
cbindgen = "0.29.3"
