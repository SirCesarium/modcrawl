[package]
name = "modcrawl"
version = "0.12.4"
edition = "2024"
rust-version = "1.99.1"
description = "Detect, inspect, and analyze Minecraft mods and plugins from JAR files"
license = "MIT"
authors = ["Cesarium <239650612+SirCesarium@users.noreply.github.com>"]
readme = "README.md"
repository = "https://github.com/SirCesarium/modcrawl"
homepage = "https://github.com/SirCesarium/modcrawl"
documentation = "https://docs.rs/modcrawl"
keywords = ["minecraft", "mod", "analyzer", "loaders", "forge"]
categories = ["development-tools", "command-line-utilities"]
include = ["src/**", "Cargo.toml", "/README.md", "/LICENSE"]

[features]
default = ["cli", "classfile"]
cli = ["dep:clap", "dep:miette", "dep:anstream", "dep:anstyle"]
classfile = ["dep:java-class-rs"]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
anstream = { version = "1.0.0", optional = true }
anstyle = { version = "1.0.14", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
java-class-rs = { version = "0.1.0", default-features = false, optional = true }
js-sys = { version = "0.3.107", optional = true }
miette = { version = "7.6.0", features = ["fancy"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.0"
wasm-bindgen = { version = "0.2.130", optional = true }
zipcrawl = { version = "4.0.0", default-features = false, features = ["serde"] }

[[bin]]
name = "modcrawl"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "modcrawl"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
absolute_paths = "deny"

[dev-dependencies]
zip = "9.4.0"

[package.metadata.deb]
maintainer = "Cesarium <239650612+SirCesarium@users.noreply.github.com>"
copyright = "2026, Cesarium"
license-file = ["LICENSE", "0"]
section = "utility"
depends = "$auto"
extended-description = "Detect, inspect, and analyze Minecraft mods and plugins from JAR files."
assets = [
  ["target/release/modcrawl", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/modcrawl/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/modcrawl", dest = "/usr/bin/modcrawl", mode = "755" },
  { source = "LICENSE", dest = "/usr/share/licenses/modcrawl/LICENSE", mode = "644" },
]
