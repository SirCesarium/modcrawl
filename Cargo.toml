[package]
name = "modcrawl"
version = "0.4.0"
edition = "2024"
description = "Detect, inspect, and analyze Minecraft mods and plugins from JAR files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/SirCesarium/modcrawl"
homepage = "https://github.com/SirCesarium/modcrawl"
documentation = "https://docs.rs/modcrawl"
keywords = ["minecraft", "mod", "analyzer", "loaders", "forge"]
categories = ["development-tools", "development-tools::ffi", "command-line-utilities"]

[features]
default = ["cli", "classfile"]
cli = ["dep:clap"]
classfile = ["dep:java-class-rs"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"], optional = true }
java-class-rs = { version = "0.1.0", default-features = false, optional = true }
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "0.0.27"
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "1.1.2"
zipcrawl = { version = "2.4.0", default-features = false, features = ["serde"] }

[[bin]]
name = "modcrawl"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "modcrawl"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
absolute_paths = "deny"

[build-dependencies]
cbindgen = "0.29.3"

[dev-dependencies]
zip = "8"
